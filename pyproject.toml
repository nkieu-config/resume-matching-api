[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resume-matcher"
version = "0.1.0"
description = "Resume matching API for the AI & Data Solution role"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.139,<1",
  "google-genai>=2.13,<3",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.10,<3",
  "pypdf>=6.14,<7",
  "python-multipart>=0.0.20,<1",
  "pyyaml>=6.0,<7",
  "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pillow>=11,<13",
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "reportlab>=4.4,<5",
  "ruff>=0.12,<1",
  "types-pyyaml>=6.0,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/resume_matcher"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: calls the live Gemini API",
  "evaluation: runs prompt evaluation fixtures",
]

[tool.coverage.run]
branch = true
source = ["src/resume_matcher"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src/resume_matcher"]
